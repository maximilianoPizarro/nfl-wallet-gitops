# Namespace labels for Istio mesh. Merges with namespace from Helm chart.
# Uses istio-injection (same as dev). Ambient mode disabled due to HBONE
# routing incompatibility with Istio Gateway in Sail v1.27.x.
apiVersion: v1
kind: Namespace
metadata:
  name: nfl-wallet-prod
  labels:
    istio-injection: enabled
