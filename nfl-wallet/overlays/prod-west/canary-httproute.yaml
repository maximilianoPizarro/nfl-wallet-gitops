# Canary HTTPRoute: dedicated hostname routing 100% to test webapp (0.1.3).
# Uses nfl-wallet-canary hostname so the SPA serves consistent assets.
# Requires ReferenceGrant "allow-prod-canary" in nfl-wallet-test.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nfl-wallet-webapp-canary
  labels:
    app: webapp
    app.kubernetes.io/component: httproute-canary
spec:
  parentRefs:
    - name: nfl-wallet-gateway
  hostnames:
    - "nfl-wallet-canary.apps.cluster-7rt9h.7rt9h.sandbox1900.opentlc.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: webapp
          namespace: nfl-wallet-test
          port: 5173
