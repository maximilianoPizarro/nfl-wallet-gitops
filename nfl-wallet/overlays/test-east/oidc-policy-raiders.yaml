# Override chart's OIDC AuthPolicy to fix Rego compile error
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: nfl-wallet-api-raiders-oidc
  labels:
    app: api-raiders
    app.kubernetes.io/component: authpolicy-oidc
    app.kubernetes.io/part-of: nfl-wallet
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: nfl-wallet-api-raiders
  rules:
    authentication:
      "api-key":
        priority: 1
        apiKey:
          selector:
            matchLabels:
              api: nfl-wallet-test
          allNamespaces: true
        credentials:
          customHeader:
            name: X-Api-Key
      oidc-jwt:
        credentials:
          authorizationHeader:
            prefix: Bearer
        jwt:
          issuerUrl: https://nfl-wallet-rhbk-neuroface-nfl-wallet-test.apps.cluster-64k4b.64k4b.sandbox5146.opentlc.com/realms/neuroface
    response:
      success:
        headers:
          x-auth-user:
            plain:
              value: \{auth.identity.preferred_username\}
      unauthenticated:
        body:
          value: '{"error":"Unauthorized","message":"A valid Bearer token is required. Authenticate via the OIDC provider."}'
        headers:
          content-type:
            value: application/json
