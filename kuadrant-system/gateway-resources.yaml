# Gateway proxy resource requirements per namespace.
#
# NOT included in the kuadrant-resources ApplicationSet because the Deployment
# nfl-wallet-gateway-istio is already tracked by the nfl-wallet ArgoCD Application
# (Istio creates it from the Helm chart's Gateway resource). Including it in a
# second Application causes SharedResourceWarning.
#
# Apply manually on each managed cluster if needed:
#   kubectl apply -f kuadrant-system/gateway-resources.yaml
#
# The main latency bottleneck is Authorino (ext-authz), not the gateway proxy.
# resource-requirements.yaml (Authorino + Limitador) IS deployed via GitOps.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfl-wallet-gateway-istio
  namespace: nfl-wallet-dev
spec:
  template:
    spec:
      containers:
        - name: istio-proxy
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 2Gi
---
